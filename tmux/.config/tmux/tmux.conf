# =============================================================================
# tmux configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Prefix key
# ---------------------------------------------------------------------------
# Default prefix is C-b, which is awkward to reach. C-a is the classic
# alternative — easy to hit and used by screen veterans.
# To send a literal C-a (go to beginning of line), press C-a twice.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------

# Enable true color and 256 color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# Let terminal graphics protocols pass through tmux. Ghostty supports inline
# images, but tmux blocks the escape sequences unless passthrough is enabled.
# Use "all" so Kitty/Ghostty graphics emitted by apps inside tmux reach Ghostty.
set -g allow-passthrough all

# Refresh Wayland/session env from the attached terminal for new panes.
# Use explicit array slots so repeated config reloads do not duplicate entries.
set -g update-environment[100] WAYLAND_DISPLAY
set -g update-environment[101] XDG_RUNTIME_DIR
set -g update-environment[102] DBUS_SESSION_BUS_ADDRESS
set -g update-environment[103] TERM_PROGRAM
set -g update-environment[104] TERM_PROGRAM_VERSION

# Forward modified keys like Shift+Enter to terminal programs.
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ",alacritty:extkeys,xterm-ghostty:extkeys,xterm-256color:extkeys"

# Enable mouse support (scroll, click to select pane, resize panes by dragging)
set -g mouse on

# Start window and pane numbering at 1 (0 is too far from the prefix key)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Keep failed panes around so build/OOM errors are readable and respawnable.
set -g remain-on-exit failed

# If the attached session is destroyed, move the client to another session
# instead of detaching whenever another session exists.
set -g detach-on-destroy off

# Don't let programs rename the window (keep manually set names)
set -g allow-rename off
setw -g automatic-rename off

# Increase scrollback buffer
set -g history-limit 50000

# Faster escape time (important for vim/neovim users)
set -sg escape-time 0

# Increase display time for messages and pane indicators
set -g display-time 2000
set -g display-panes-time 2000

# Enable focus events (needed for vim autoread)
set -g focus-events on

# Use vi keys in copy mode
setw -g mode-keys vi

# Monitor bells in other windows and flag them in the status bar
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Clear any notification highlight when switching to a window, and keep the
# cross-session notification cache in sync for the status bar and chooser.
set-hook -g pane-focus-in[0] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify clear #{pane_id}'"
set-hook -g client-session-changed[100] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify clear #{pane_id}'"
set-hook -g session-window-changed[100] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify clear #{pane_id}'"
set-hook -g window-linked[100] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify-cache'"
set-hook -g window-unlinked[100] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify-cache'"
set-hook -g session-created[100] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify-cache'"
set-hook -g session-closed[100] "run-shell -b '~/.config/tmux/scripts/agent-tmux-notify-cache'"
run-shell -b '~/.config/tmux/scripts/agent-tmux-notify-cache'

# ---------------------------------------------------------------------------
# Keybindings — Window management
# ---------------------------------------------------------------------------

# Create new window (default: prefix + c)
# Switch windows: prefix + number, or prefix + n/p for next/prev

# Shift+Alt+h/l to switch windows without prefix (fast!)
bind -n M-H previous-window
bind -n M-L next-window

# ---------------------------------------------------------------------------
# Keybindings — Pane splitting
# ---------------------------------------------------------------------------
# The defaults (% and ") are impossible to remember.
# Use | for vertical split and - for horizontal split (visual mnemonics).
# Open new panes in the current directory.

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Also bind \ (unshifted |) for convenience
bind \\ split-window -h -c "#{pane_current_path}"

# New windows should also open in the current directory
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Keybindings — Pane navigation (vim-style)
# ---------------------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------------------------------------------------------------------------
# Keybindings — Pane resizing
# ---------------------------------------------------------------------------
# Hold prefix, then use H/J/K/L to resize in 5-cell increments

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Keybindings — Copy mode (vi-style)
# ---------------------------------------------------------------------------
# Enter copy mode: prefix + [
# Select text: v (begin selection), y (yank/copy)
# Paste: prefix + ]  or  prefix + p

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind p run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"

# ---------------------------------------------------------------------------
# Keybindings — Quality of life
# ---------------------------------------------------------------------------

# Easy config reload: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Safer session chooser: hide the current session so tree-mode x cannot kill it.
bind s if -F '#{>:#{server_sessions},1}' 'choose-tree -s -f "#{!=:#{session_name},#{client_session}}" -F "#{E:@agent_tmux_notify_prefix}#{session_name}"' 'display-message "Only one tmux session; create another session before killing this one."'

# Kill pane without confirmation (prefix + x already asks, this skips it)
bind x kill-pane

# Restart an exited pane after remain-on-exit preserves it.
bind R respawn-pane -k

# Swap windows left/right with Ctrl+Shift+arrow
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ---------------------------------------------------------------------------
# Plugins (managed by tpm)
# ---------------------------------------------------------------------------

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W: #T"
set -g @catppuccin_window_current_text " #W: #T"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_right_separator ""

# Status bar modules
set -g status-left ""
set -g status-right "#(~/.config/tmux/scripts/agent-tmux-notify-sessions '#{session_name}')#{E:@catppuccin_status_session}"
set -g status-right-length 100

# Persist tmux sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Make session renames survive restarts immediately instead of waiting for the
# next tmux-continuum autosave interval.
set-hook -g session-renamed "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet'"

# Better search in copy mode
set -g @plugin 'tmux-plugins/tmux-copycat'

# Yank to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Keybinding popup helper (prefix + Space to show)
set -g @plugin 'alexwforsythe/tmux-which-key'

# ---------------------------------------------------------------------------
# Initialize tpm (keep this at the very bottom)
# ---------------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'

# Override catppuccin's bell-style (flat bg breaks the rounded multi-segment format).
# The flag icon 󰂞 from @catppuccin_window_flags already indicates bell windows.
set -g window-status-bell-style "none"
